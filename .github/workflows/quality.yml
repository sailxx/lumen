name: Repository quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-checks:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install packaging tools
        run: dnf install -y bash coreutils findutils git glib2 gzip python3 rpm-build tar zip

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          for script in setup-monitor-brightness.sh extension/install.sh extension/package.sh rpm/build-rpm.sh deb/build-deb.sh macos/build-app.sh macos/install.sh arch/PKGBUILD arch/lumen.install; do
            bash -n "$script"
          done

      - name: Validate metadata and package manifest
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          metadata = json.loads((root / "extension/metadata.json").read_text())

          assert metadata["uuid"] == "lumen@vlad"
          assert isinstance(metadata["version"], int)

          manifest = [
              line.strip()
              for line in (root / "extension/extension-files.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]

          assert "metadata.json" in manifest
          assert "schemas/org.gnome.shell.extensions.monitor-brightness.gschema.xml" in manifest

          for relative_path in manifest:
              path = root / "extension" / relative_path
              assert path.is_file(), f"Manifest file missing: {relative_path}"

          spec = (root / "rpm/gnome-shell-extension-lumen.spec").read_text()
          spec_version = re.search(r"^Version:\s*(\d+)", spec, re.MULTILINE)
          assert spec_version and int(spec_version.group(1)) == metadata["version"]
          PY

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run extension/schemas

      - name: Build and inspect extension archive
        run: |
          extension/package.sh "$RUNNER_TEMP/lumen.zip"
          python3 - "$RUNNER_TEMP/lumen.zip" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          root = Path.cwd()
          archive = ZipFile(sys.argv[1])
          contents = {name.removeprefix("./") for name in archive.namelist()}
          manifest = {
              line.strip()
              for line in (root / "extension/extension-files.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          assert manifest <= contents, f"Archive is missing: {sorted(manifest - contents)}"
          assert "schemas/gschemas.compiled" in contents
          PY

      - name: Build and inspect Fedora RPM
        run: |
          rpm/build-rpm.sh
          rpm_file="$(find rpm/rpmbuild/RPMS/noarch -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$rpm_file"
          rpm -qpl "$rpm_file" > "$RUNNER_TEMP/rpm-files.txt"
          python3 - "$RUNNER_TEMP/rpm-files.txt" <<'PY'
          import sys

          files = set(open(sys.argv[1], encoding="utf-8").read().splitlines())
          extension_root = "/usr/share/gnome-shell/extensions/lumen@vlad"
          for name in ("extension.js", "ddcutil.js", "backlight.js", "prefs.js", "stylesheet.css", "metadata.json"):
              assert f"{extension_root}/{name}" in files, f"RPM is missing {name}"
          assert "/usr/share/glib-2.0/schemas/org.gnome.shell.extensions.monitor-brightness.gschema.xml" in files
          PY

  macos-build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build native menu bar app
        run: swift build --package-path macos -c release

  deb-package-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          ./deb/build-deb.sh "$RUNNER_TEMP/lumen.deb"
          dpkg-deb --info "$RUNNER_TEMP/lumen.deb"
