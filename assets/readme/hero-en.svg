  <circle cx="1080" cy="520" r="52" fill="none" stroke="#DCE9F8" stroke-width="3"/>

  <!-- GNOME top bar -->
  <rect x="80" y="64" width="1040" height="46" rx="10" fill="#1D222B"/>
  <text x="104" y="93" font-size="17" fill="#CFD8E3">Activities</text>
  <text x="600" y="93" font-size="17" fill="#E8EDF4" text-anchor="middle">Oct 31  19:42</text>
  <!-- signal -->
