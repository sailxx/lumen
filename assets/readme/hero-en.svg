  <rect x="1119" y="85.5" width="3" height="4" fill="#CFD8E3"/>
  <rect x="1099" y="85" width="12" height="5" fill="#CFD8E3"/>
  <!-- Lumen sun, highlighted -->
  <rect x="1006" y="70" width="36" height="36" rx="9" fill="#2E9BFF"/>
  <circle cx="1024" cy="88" r="6" fill="#FFFFFF"/>
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
