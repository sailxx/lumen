<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1200" height="640" fill="#F4F8FD"/>
