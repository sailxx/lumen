<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Lumen uses a 150 millisecond debounce, supports GNOME Shell 45 through 50, and needs no root access at runtime">
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>
  <rect width="880" height="260" rx="24" fill="#F3F6FA"/>
  <text class="sans" x="36" y="43" font-size="12" font-weight="700" letter-spacing="2.2" fill="#328FE3">THE SHORT VERSION</text>
  <text class="sans" x="36" y="73" font-size="24" font-weight="650" fill="#182432">Small footprint. Clear controls.</text>

  <rect x="32" y="94" width="328" height="134" rx="20" fill="#247FCB"/>
  <path d="M286 124v-12m0 64v-12m-32-20h12m40 0h12m-55-23 9 9m28 28 9 9m0-46-9 9m-28 28-9 9" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>
  <text class="mono" x="56" y="155" font-size="38" font-weight="700" fill="#FFFFFF">150 ms</text>
  <text class="sans" x="56" y="184" font-size="13" fill="#E4F2FF">Brightness writes settle before sending</text>
  <text class="sans" x="56" y="204" font-size="13" fill="#E4F2FF">the next monitor command.</text>

  <rect x="378" y="94" width="470" height="40" rx="14" fill="#FFFFFF" stroke="#DEE6EF" stroke-width="1.5"/>
  <circle cx="402" cy="114" r="9" fill="#EAF4FF"/>
  <path d="M402 108v12m-6-6h12" stroke="#328FE3" stroke-width="1.5" stroke-linecap="round"/>
  <text class="mono" x="424" y="119" font-size="16" font-weight="650" fill="#182432">0</text>
  <text class="sans" x="466" y="119" font-size="12.5" fill="#69798B">root access while adjusting brightness</text>

  <rect x="378" y="141" width="470" height="40" rx="14" fill="#FFFFFF" stroke="#DEE6EF" stroke-width="1.5"/>
  <circle cx="402" cy="161" r="9" fill="#EAF4FF"/>
  <path d="M398 161h8m-4-4v8" stroke="#328FE3" stroke-width="1.5" stroke-linecap="round"/>
  <text class="mono" x="424" y="166" font-size="16" font-weight="650" fill="#182432">1–25%</text>
  <text class="sans" x="500" y="166" font-size="12.5" fill="#69798B">configurable scroll step</text>

  <rect x="378" y="188" width="470" height="40" rx="14" fill="#FFFFFF" stroke="#DEE6EF" stroke-width="1.5"/>
  <circle cx="402" cy="208" r="9" fill="#EAF4FF"/>
  <path d="M397 208h10m-5-5 5 5-5 5" fill="none" stroke="#328FE3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" x="424" y="213" font-size="16" font-weight="650" fill="#182432">45–50</text>
  <text class="sans" x="500" y="213" font-size="12.5" fill="#69798B">supported GNOME Shell versions</text>
</svg>
